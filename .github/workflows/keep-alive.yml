# Free Supabase projects pause after 7 days without activity (e.g. over spring break).
# This pings the database every 3 days so the site never goes to sleep.
name: Keep database awake
on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS -X POST "https://sbhalwcucckiposfrdjv.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_GDinV9mtUdgwW59IlvxRAQ_fc2HLnoe" \
            -H "Content-Type: application/json" -d '{}'
